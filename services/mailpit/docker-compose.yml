version: '3.8'

networks:
  dev-network:
    external: true

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-dev
    restart: unless-stopped
    networks:
      - dev-network
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP server
      - "${MAILPIT_UI_PORT:-8026}:8025"     # Web UI
    volumes:
      - mailpit_data:/data
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATA_FILE=/data/mailpit.db
      - MP_USE_STARTTLS=false

volumes:
  mailpit_data:
    driver: local
